name: Update FRED data

on:
  schedule:
    # Weekdays 6pm Pacific. Cron is UTC, so 6pm lands on 01:00 UTC under PDT and 02:00 UTC
    # under PST, both the following day (Tue-Sat UTC = Mon-Fri Pacific). Both fire; the
    # first step drops whichever one doesn't match the current DST state.
    - cron: "0 1 * * 2-6"
    - cron: "0 2 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pick the cron that matches Pacific DST
        id: gate
        run: |
          tz=$(TZ=America/Los_Angeles date +%Z)
          sched="${{ github.event.schedule }}"
          run=true
          if [ "$sched" = "0 1 * * 2-6" ] && [ "$tz" != "PDT" ]; then run=false; fi
          if [ "$sched" = "0 2 * * 2-6" ] && [ "$tz" != "PST" ]; then run=false; fi
          echo "Pacific zone $tz, schedule '${sched:-manual}', run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Fetch FRED series
        if: steps.gate.outputs.run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_fred.py

      - name: Commit changed data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Data update $(jq -r .data_through data/latest.json)"
            git push
          fi
